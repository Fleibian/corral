# Per-instance WSL configuration. Written into every project instance by
# New-Project.ps1. The isolation guarantees of this workspace live here.
#
# __HOSTNAME__ is substituted with the project name.

[boot]
# Required for the in-instance Docker daemon.
systemd=true

[automount]
# Do NOT mount the Windows drives. Without this the agent reads all of C:\ at
# /mnt/c - your profile, SSH keys, every other project. This single setting is
# the most important one in the file.
enabled=false
mountFsTab=false

[interop]
# Do NOT let the instance execute Windows binaries or inherit the Windows PATH.
# With interop enabled an agent can launch powershell.exe and walk straight out
# of the sandbox, which would make the automount setting above pointless.
enabled=false
appendWindowsPath=false

[user]
default=dev

[network]
hostname=__HOSTNAME__
generateHosts=true
generateResolvConf=true
